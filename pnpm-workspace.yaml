packages:
  - apps/*
  - packages/*

allowBuilds:
  # `baileys` only declares a `prepare` script (`npm run build`), which is for
  # git/local installs. Registry tarballs ship prebuilt, so skip it.
  baileys: false
  esbuild: true
  msgpackr-extract: true
  protobufjs: true

catalog:
  "@elevenlabs/react": "^1.15.0"
  "@anthropic-ai/sdk": "^0.123.0"
  "@hookform/resolvers": "^5.9.1"
  "@modelcontextprotocol/core": "^2.0.0"
  "@modelcontextprotocol/express": "^2.0.0"
  "@modelcontextprotocol/node": "^2.0.0"
  "@modelcontextprotocol/server": "^2.0.0"
  "@sentry/node": "^10.73.0"
  "@sentry/react": "^10.73.0"
  "@supabase/supabase-js": "^2.113.0"
  "@tanstack/react-query": "^5.102.8"
  "@testing-library/jest-dom": "^7.0.1"
  "@testing-library/react": "^16.3.3"
  "@types/cors": "^2.8.19"
  "@types/express": "^5.0.6"
  "@types/node": "^24.13.3"
  "@types/qrcode-terminal": "^0.12.2"
  "@types/react": "^19.2.18"
  "@types/react-dom": "^19.2.5"
  "@types/supertest": "^7.2.1"
  "@vitejs/plugin-react": "^6.1.1"
  baileys: "^7.0.0-rc14"
  bullmq: "^6.3.4"
  cors: "^2.8.6"
  dotenv: "^17.4.2"
  express: "^5.2.1"
  express-rate-limit: "^8.7.0"
  helmet: "^8.3.0"
  i18next: "^26.4.1"
  ioredis: "^5.11.1"
  jsdom: "^30.0.1"
  pino: "^10.3.1"
  pino-pretty: "^13.1.3"
  qrcode-terminal: "^0.12.0"
  react: "^19.2.8"
  react-dom: "^19.2.8"
  react-hook-form: "^7.87.0"
  react-i18next: "^17.0.13"
  react-router: "^8.3.1"
  supertest: "^7.2.2"
  tsx: "^4.23.13"
  typescript: "~5.9.3"
  vite: "^8.2.2"
  vitest: "^4.1.11"
  zod: "^4.5.4"

minimumReleaseAgeExclude:
