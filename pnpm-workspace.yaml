  - '@supabase/auth-js@2.113.0'
  - '@supabase/functions-js@2.113.0'
  - '@supabase/postgrest-js@2.113.0'
  - '@supabase/realtime-js@2.113.0'
  - '@supabase/storage-js@2.113.0'
  - '@supabase/supabase-js@2.113.0'
  - eslint-plugin-react-refresh@0.5.6
