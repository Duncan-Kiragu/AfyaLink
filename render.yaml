# Staging/production service names from the spec. Credentials stay in Render.
# Fill remaining secrets in the dashboard. REDIS_URL is wired from the Key Value instance.

services:
  - type: keyvalue
    name: kkd-redis-stage
    ipAllowList: []
    maxmemoryPolicy: noeviction

  - type: web
    name: kkd-web-stage
    runtime: static
    buildCommand: pnpm install --frozen-lockfile && pnpm --filter @kkd/web build
    staticPublishPath: ./apps/web/dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

  - type: web
    name: kkd-api-stage
    runtime: node
    buildCommand: pnpm install --frozen-lockfile && pnpm --filter @kkd/api build
    startCommand: pnpm --filter @kkd/api start
    envVars:
      - key: REDIS_URL
        fromService:
          name: kkd-redis-stage
          type: keyvalue
          property: connectionString

  - type: worker
    name: kkd-worker-stage
    runtime: node
    buildCommand: pnpm install --frozen-lockfile && pnpm --filter @kkd/worker build
    startCommand: pnpm --filter @kkd/worker start
    envVars:
      - key: REDIS_URL
        fromService:
          name: kkd-redis-stage
          type: keyvalue
          property: connectionString

  # Baileys holds one stateful WebSocket and one WhatsApp linked-device session,
  # so this must be a single-instance background worker rather than a scaled web
  # service. A Redis lock enforces the single writer if it is ever scaled up.
  - type: worker
    name: kkd-whatsapp-stage
    runtime: node
    buildCommand: pnpm install --frozen-lockfile && pnpm --filter @kkd/whatsapp-gateway build
    startCommand: pnpm --filter @kkd/whatsapp-gateway start
    envVars:
      - key: REDIS_URL
        fromService:
          name: kkd-redis-stage
          type: keyvalue
          property: connectionString

  - type: web
    name: kkd-mcp-stage
    runtime: node
    buildCommand: pnpm install --frozen-lockfile && pnpm --filter @kkd/mcp build
    startCommand: pnpm --filter @kkd/mcp start
